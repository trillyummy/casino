<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrillCAZINO</title>
    <style>
        /* --- БАЗОВЫЙ ДИЗАЙН (КАК НА СКРИНШОТЕ) --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: #121212; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* Уведомления */
        #toast-container {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; z-index: 10000; display: flex; flex-direction: column; gap: 8px;
        }
        .toast {
            background: #2a2a35; color: white; padding: 12px 15px; border-radius: 10px;
            border-left: 4px solid #007bff; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            font-weight: bold; font-size: 14px; animation: slideDown 0.3s ease-out forwards;
        }
        .toast.success { border-color: #4CAF50; }
        .toast.danger { border-color: #ff4d4d; }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Шапка (как на скрине) */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #121212; }
        .header-btn { background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; }
        .header-title { font-weight: bold; font-size: 16px; text-align: center; }
        .header-subtitle { font-size: 12px; color: #888; text-align: center; }

        /* Панель юзера (как на скрине) */
        .user-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 15px; background: #121212; margin-bottom: 10px;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #333; }
        .level-box { background: #1e1e24; padding: 5px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .level-progress { width: 30px; height: 4px; background: #4CAF50; border-radius: 2px; }
        .balance-box { background: #1e1e24; padding: 5px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .menu-btn { background: #1e1e24; border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }

        /* Контентная часть */
        .content { flex: 1; overflow-y: auto; padding: 15px; position: relative; }
        .view { display: none; flex-direction: column; height: 100%; animation: fadeIn 0.2s; }
        .view.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- SIM КАРТОЧКА (ТОЧЬ-В-ТОЧЬ КАК НА СКРИНЕ) --- */
        .sim-card-wrapper { margin-bottom: 20px; }
        .sim-card {
            background: #18181d; border: 1px solid #2a2a35; border-radius: 16px;
            padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .sim-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sim-chip { width: 40px; height: 30px; background: linear-gradient(135deg, #d4a75c, #b8860b); border-radius: 5px; }
        .sim-logo { color: #333; font-weight: 900; font-style: italic; font-size: 20px; }
        .sim-number-text { font-size: 26px; font-weight: 900; letter-spacing: 1px; text-align: center; margin-bottom: 20px; }
        
        /* Тот самый черный пустой блок под номером */
        .sim-empty-block {
            background: #000; border-radius: 10px; min-height: 80px;
            display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; align-content: flex-start;
        }
        .empty-text { color: #444; width: 100%; text-align: center; margin-top: 25px; font-size: 14px; }
        .scanned-num { background: #1e1e24; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; border: 1px solid #333; }

        /* Инфо панели (Архив/Роуминг) */
        .info-row { display: flex; justify-content: space-between; background: #121212; border: 1px solid #222; border-radius: 12px; padding: 15px; margin-bottom: 10px; font-size: 14px; }
        .info-label { color: #888; }
        .info-value { color: #fff; font-weight: bold; }
        .info-value.blue { color: #4a90e2; }
        .info-value.gold { color: #d4a75c; }

        /* Кнопки X5 */
        .action-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-main { flex: 2; background: #4a90e2; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-secondary { flex: 1; background: #8e44ad; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-main:active, .btn-secondary:active { transform: scale(0.98); }

        /* --- МОДАЛЬНОЕ ОКНО МЕНЮ --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 999; display: none;
            justify-content: center; align-items: center; opacity: 0; transition: opacity 0.2s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .menu-modal {
            background: #1e1e24; width: 90%; max-width: 350px; border-radius: 20px;
            padding: 20px; border: 1px solid #333; display: flex; flex-direction: column; gap: 10px;
        }
        .menu-btn-item {
            background: #121212; border: 1px solid #2a2a35; color: white;
            padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold;
            text-align: left; cursor: pointer; display: flex; justify-content: space-between;
        }
        .menu-btn-item:active { background: #2a2a35; }
        .menu-close { background: #ff4d4d; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* --- ИГРОВЫЕ ЭКРАНЫ (КРАШ, КОСТИ, МОНЕТКА) --- */
        .game-header { font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 15px; }
        
        /* Общие элементы ввода */
        .input-group { margin-bottom: 15px; }
        .input-group label { font-size: 12px; color: #888; display: block; margin-bottom: 5px; }
        input[type="number"] { width: 100%; background: #121212; border: 1px solid #333; color: white; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: bold; outline: none; }
        
        /* Краш */
        .crash-screen { height: 200px; background: #000; border-radius: 16px; border: 1px solid #333; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; margin-bottom: 15px; }
        .multiplier { font-size: 50px; font-weight: 900; z-index: 2; }
        .multiplier.crashed { color: #ff4d4d; }
        .rocket { font-size: 40px; position: absolute; bottom: 20px; left: 20px; z-index: 1; transition: transform 0.1s linear; }
        
        /* Кости */
        .dice-arena { display: flex; justify-content: space-between; background: #1e1e24; padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid #333; }
        .dice-p { text-align: center; flex: 1; }
        .dice-p-title { font-size: 12px; color: #888; margin-bottom: 5px; }
        .dice-val { font-size: 40px; height: 50px; line-height: 50px; }
        .dice-score { font-size: 20px; font-weight: bold; }
        .dice-shake { animation: shake 0.3s infinite; }
        @keyframes shake { 0% { transform: rotate(0); } 25% { transform: rotate(10deg); } 50% { transform: rotate(-10deg); } 75% { transform: rotate(5deg); } 100% { transform: rotate(0); } }
        
        /* Монетка */
        .coin-area { display: flex; flex-direction: column; align-items: center; background: #1e1e24; padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid #333; }
        .coin-img { font-size: 60px; height: 80px; line-height: 80px; margin-bottom: 10px; }
        .coin-flip { animation: spin 0.4s infinite linear; }
        @keyframes spin { 0% { transform: rotateY(0); } 100% { transform: rotateY(360deg); } }
        
        /* Кнопки игр */
        .game-btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; color: white; }
        .bg-blue { background: #4a90e2; }
        .bg-orange { background: #ff9800; }
        .bg-green { background: #4CAF50; }
        .bg-red { background: #ff4d4d; }
        .bg-purple { background: #8e44ad; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- Шапка (как на скрине) -->
    <div class="header">
        <button class="header-btn">Закрыть</button>
        <div>
            <div class="header-title">TrillCAZINO</div>
            <div class="header-subtitle">мини-приложение</div>
        </div>
        <button class="header-btn" style="font-size: 24px;">⋮</button>
    </div>

    <!-- Панель юзера (как на скрине) -->
    <div class="user-bar">
        <div class="user-info">
            <div class="avatar"></div>
            <div class="level-box">Ур. 2 <div class="level-progress"></div></div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="balance-box">
                <span id="globalBalance">1000</span>
                <span style="color:#888;">🪙</span>
            </div>
            <!-- Кнопка меню (гамбургер) для переключения игр -->
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
        </div>
    </div>

    <!-- Основной контент -->
    <div class="content">

        <!-- ЭКРАН 1: SIM (По умолчанию, как на скрине) -->
        <div id="view-sim" class="view active">
            <div class="sim-card-wrapper">
                <div class="sim-card">
                    <div class="sim-top">
                        <div class="sim-chip"></div>
                        <div class="sim-logo">SIM</div>
                    </div>
                    <div class="sim-number-text">+0 000 000-00-00</div>
                    
                    <!-- Тот самый блок для номеров -->
                    <div class="sim-empty-block" id="simNumbersBox">
                        <div class="empty-text">Тут появятся 5 номеров</div>
                    </div>
                </div>
            </div>

            <div class="info-row">
                <span class="info-label">Архив: <span class="info-value blue">Правительственный</span></span>
                <span class="info-value gold">200 000 🪙</span>
            </div>
            
            <div class="info-row">
                <span class="info-label">Роуминг: <span class="info-value blue">Любая</span></span>
                <span style="color: #4a90e2;">✈️</span>
            </div>

            <div class="action-btns">
                <button class="btn-main" onclick="scanX5()">СКАНИРОВАТЬ X5</button>
                <button class="btn-secondary" onclick="openUpgradeModal()">X5</button>
            </div>
        </div>

        <!-- ЭКРАН 2: КРАШ -->
        <div id="view-crash" class="view">
            <div class="game-header">КРАШ</div>
            <div class="crash-screen">
                <div class="multiplier" id="crashMult">1.00x</div>
                <div class="rocket" id="crashRocket">🚀</div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex:1;">
                    <label>Ставка</label>
                    <input type="number" id="crashBetInput" value="100">
                </div>
                <div class="input-group" style="flex:1;">
                    <label>Автозабор (0=выкл)</label>
                    <input type="number" id="crashAutoInput" value="0" step="0.1">
                </div>
            </div>
            <button class="game-btn bg-blue" id="crashActionBtn">ПОСТАВИТЬ</button>
        </div>

        <!-- ЭКРАН 3: КОСТИ -->
        <div id="view-dice" class="view">
            <div class="game-header">КОСТИ (1 на 1)</div>
            <div class="dice-arena">
                <div class="dice-p">
                    <div class="dice-p-title">Ты</div>
                    <div class="dice-val" id="diceP1Visual">🎲</div>
                    <div class="dice-score" id="diceP1Score" style="color:#4a90e2;">-</div>
                </div>
                <div style="font-size:20px; color:#555; align-self:center;">VS</div>
                <div class="dice-p">
                    <div class="dice-p-title">Бот</div>
                    <div class="dice-val" id="diceP2Visual">🎲</div>
                    <div class="dice-score" id="diceP2Score" style="color:#ff4d4d;">-</div>
                </div>
            </div>
            <div class="input-group">
                <label>Ставка (на кон)</label>
                <input type="number" id="diceBetInput" value="100">
            </div>
            <button class="game-btn bg-blue" id="diceRollBtn" onclick="rollDice()">БРОСИТЬ КОСТИ</button>
            <div id="diceStatus" style="text-align:center; color:#888; font-size:14px; margin-top:10px;">Сделай ставку и брось</div>
        </div>

        <!-- ЭКРАН 4: МОНЕТКА -->
        <div id="view-coin" class="view">
            <div class="game-header">МОНЕТКА</div>
            <div class="coin-area">
                <div class="coin-img" id="coinVisual">🪙</div>
                <div id="coinStatus" style="color:#888; font-size:14px;">Выбери сторону</div>
            </div>
            <div class="input-group">
                <label>Ставка</label>
                <input type="number" id="coinBetInput" value="100">
            </div>
            <div style="display:flex; gap:10px;">
                <button class="game-btn bg-blue" style="flex:1;" onclick="flipCoin('Орел')">ОРЁЛ</button>
                <button class="game-btn bg-red" style="flex:1;" onclick="flipCoin('Решка')">РЕШКА</button>
            </div>
        </div>

    </div>

    <!-- СКРЫТОЕ МЕНЮ -->
    <div class="modal-overlay" id="mainMenu" onclick="toggleMenu(event)">
        <div class="menu-modal" onclick="event.stopPropagation()">
            <div style="text-align:center; font-weight:bold; margin-bottom:10px; color:#888;">НАВИГАЦИЯ</div>
            <button class="menu-btn-item" onclick="switchView('sim')">📱 Сим-карта (Профиль)</button>
            <button class="menu-btn-item" onclick="switchView('crash')">🚀 Краш</button>
            <button class="menu-btn-item" onclick="switchView('dice')">🎲 Кости</button>
            <button class="menu-btn-item" onclick="switchView('coin')">🪙 Монетка</button>
            <button class="menu-close" onclick="toggleMenu()">ЗАКРЫТЬ</button>
        </div>
    </div>

    <!-- СКРЫТОЕ ОКНО АПГРЕЙДА -->
    <div class="modal-overlay" id="upgradeModal" onclick="closeUpgradeModal(event)">
        <div class="menu-modal" onclick="event.stopPropagation()">
            <div style="text-align:center; font-weight:bold; margin-bottom:10px;">АПГРЕЙД СИМ-КАРТЫ</div>
            <div class="input-group">
                <label>Сумма апгрейда (за 5 номеров)</label>
                <input type="number" id="upgradeAmountInput" value="500">
            </div>
            <button class="game-btn bg-purple" onclick="doUpgrade()">АПГРЕЙД</button>
            <button class="menu-close" onclick="closeUpgradeModal()">ОТМЕНА</button>
        </div>
    </div>

    <script>
        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        let balance = 1000;
        let inventory = [];
        const balEl = document.getElementById('globalBalance');

        // Уведомления (Тосты)
        function notify(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.innerText = msg;
            c.appendChild(t);
            setTimeout(() => {
                t.style.animation = 'slideDown 0.3s reverse forwards';
                setTimeout(() => t.remove(), 300);
            }, 3000);
        }

        function updateBalance() {
            balEl.innerText = balance.toFixed(0);
        }

        // --- НАВИГАЦИЯ (МЕНЮ) ---
        function toggleMenu(e) {
            if(e && e.target !== e.currentTarget) return;
            const m = document.getElementById('mainMenu');
            m.classList.toggle('active');
        }

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            toggleMenu(); // Закрываем меню
        }

        // --- ЛОГИКА SIM И АПГРЕЙД ---
        function scanX5() {
            if (inventory.length >= 50) return notify("Инвентарь полон (макс 50)", 'danger');
            
            for (let i = 0; i < 5; i++) {
                let num = "+7 9";
                for (let j = 0; j < 9; j++) {
                    num += Math.floor(Math.random() * 10);
                    if (j === 2 || j === 5 || j === 7) num += "-";
                }
                inventory.push(num);
            }
            renderSim();
            notify("Отсканировано 5 номеров!", 'success');
        }

        function renderSim() {
            const box = document.getElementById('simNumbersBox');
            box.innerHTML = '';
            if (inventory.length === 0) {
                box.innerHTML = '<div class="empty-text">Тут появятся 5 номеров</div>';
            } else {
                inventory.forEach(n => {
                    let d = document.createElement('div');
                    d.className = 'scanned-num';
                    d.innerText = n;
                    box.appendChild(d);
                });
            }
        }

        function openUpgradeModal() {
            if (inventory.length < 5) return notify("Нужно минимум 5 номеров для апгрейда!", 'danger');
            document.getElementById('upgradeModal').classList.add('active');
        }

        function closeUpgradeModal(e) {
            if(e && e.target !== e.currentTarget) return;
            document.getElementById('upgradeModal').classList.remove('active');
        }

        function doUpgrade() {
            let cost = parseInt(document.getElementById('upgradeAmountInput').value);
            if (isNaN(cost) || cost < 100) return notify("Мин. сумма 100", 'danger');
            if (balance < cost) return notify("Недостаточно средств", 'danger');
            
            inventory.splice(0, 5);
            balance -= cost;
            
            let profit = Math.floor(Math.random() * (cost * 2)) + cost;
            balance += profit;
            
            updateBalance();
            renderSim();
            closeUpgradeModal();
            notify(`Апгрейд! Потрачено ${cost}, получено ${profit} 🪙`, 'success');
        }


        // --- ЛОГИКА КРАШ ---
        let cState = 'WAIT'; // WAIT, FLY, CRASH
        let cMult = 1.00;
        let cBet = 0;
        let cAuto = 0;
        let cTimer = null;

        const cMultEl = document.getElementById('crashMult');
        const cBtn = document.getElementById('crashActionBtn');
        const cRocket = document.getElementById('crashRocket');

        function startCrash() {
            cState = 'WAIT'; cMult = 1.00; cBet = 0; cAuto = 0;
            cMultEl.innerText = "1.00x"; cMultEl.classList.remove('crashed');
            cRocket.innerText = "🚀"; cRocket.style.transform = "translate(0,0)";
            cBtn.className = "game-btn bg-blue"; cBtn.innerText = "ПОСТАВИТЬ"; cBtn.disabled = false;

            setTimeout(() => { if(cState === 'WAIT') flyCrash(); }, 5000);
        }

        function flyCrash() {
            cState = 'FLY';
            if (cBet > 0) {
                if (cAuto > 0) { cBtn.innerText = `АВТО НА ${cAuto}x`; cBtn.disabled = true; }
                else { cBtn.className = "game-btn bg-orange"; cBtn.innerText = "ЗАБРАТЬ"; cBtn.disabled = false; }
            } else { cBtn.disabled = true; cBtn.innerText = "НЕ УСПЕЛ"; }

            cTimer = setInterval(() => {
                if (cState !== 'FLY') return;
                cMult += 0.05;
                cMultEl.innerText = cMult.toFixed(2) + "x";
                cRocket.style.transform = `translate(${Math.min((cMult-1)*15, 200)}px, ${-Math.min((cMult-1)*8, 100)}px)`;

                if (cBet > 0 && cAuto > 0 && cMult >= cAuto) { cashoutCrash(cAuto, true); return; }
                if (cMult > 1.5 && Math.random() < 0.02) { crashCrash(); }
            }, 100);
        }

        function cashoutCrash(mult, isAuto) {
            cState = 'CRASH'; clearInterval(cTimer);
            let win = Math.floor(cBet * mult); balance += win; updateBalance();
            cBtn.className = "game-btn bg-green"; cBtn.innerText = `ЗАБРАНО ${mult.toFixed(2)}x`; cBtn.disabled = true;
            cMultEl.innerText = "ЗАБРАНО!"; cMultEl.classList.add('crashed'); cMultEl.style.color = "#4CAF50"; cRocket.innerText = "💰";
            
            notify(isAuto ? `🤖 АВТОЗАБОР ${mult}x! +${win} 🪙` : `Забрано ${mult}x! +${win} 🪙`, 'success');
            setTimeout(() => { cMultEl.style.color = ""; startCrash(); }, 3000);
        }

        function crashCrash() {
            cState = 'CRASH'; clearInterval(cTimer);
            cMultEl.innerText = "КРАШ!"; cMultEl.classList.add('crashed'); cRocket.innerText = "💥";
            cBtn.disabled = true; cBtn.className = "game-btn bg-red"; cBtn.innerText = "ПРОИГРАЛ";
            if(cBet > 0) notify(`Краш! Потеряно ${cBet} 🪙`, 'danger');
            setTimeout(startCrash, 3000);
        }

        cBtn.onclick = () => {
            if (cState === 'WAIT') {
                let b = parseInt(document.getElementById('crashBetInput').value);
                if (b < 10 || balance < b) return notify("Ошибка ставки", 'danger');
                let a = parseFloat(document.getElementById('crashAutoInput').value);
                cAuto = a >= 1.01 ? a : 0;
                balance -= b; cBet = b; updateBalance();
                cBtn.disabled = true; cBtn.innerText = "СТАВКА ПРИНЯТА";
            } else if (cState === 'FLY' && cBet > 0 && cAuto === 0) {
                cashoutCrash(cMult, false);
            }
        };


        // --- ЛОГИКА КОСТИ ---
        let dTurn = 'P1'; // P1, BOT, END
        let dBotScore = 0;
        
        const dP1V = document.getElementById('diceP1Visual');
        const dP2V = document.getElementById('diceP2Visual');
        const dP1S = document.getElementById('diceP1Score');
        const dP2S = document.getElementById('diceP2Score');
        const dBtn = document.getElementById('diceRollBtn');
        const dStatus = document.getElementById('diceStatus');

        function rollDice() {
            if (dTurn !== 'P1') return;
            let bet = parseInt(document.getElementById('diceBetInput').value);
            if (bet < 10 || balance < bet) return notify("Ошибка ставки", 'danger');

            balance -= bet; updateBalance();
            dTurn = 'WAIT';
            dBtn.disabled = true; dBtn.innerText = "БРОСАЕМ...";
            dP1V.classList.add('dice-shake');
            dStatus.innerText = "Твой бросок...";

            setTimeout(() => {
                dP1V.classList.remove('dice-shake');
                let p1 = Math.floor(Math.random() * 11) + 2;
                dP1S.innerText = p1;
                dStatus.innerText = "Ход бота...";

                // Бот бросает в фоне (ты можешь уйти на другую вкладку)
                setTimeout(() => {
                    let p2 = Math.floor(Math.random() * 11) + 2;
                    dP2S.innerText = p2;
                    dTurn = 'P1';
                    dBtn.disabled = false; dBtn.innerText = "БРОСИТЬ КОСТИ";
                    dStatus.innerText = "Сделай ставку и брось";

                    if (p1 > p2) {
                        balance += bet * 2; updateBalance();
                        notify(`Кости: Победа! (${p1} vs ${p2}) +${bet*2} 🪙`, 'success');
                        if(document.getElementById('view-dice').classList.contains('active')) dStatus.innerHTML = `<span style="color:#4CAF50;">ПОБЕДА!</span>`;
                    } else if (p2 > p1) {
                        notify(`Кости: Проигрыш (${p1} vs ${p2})`, 'danger');
                        if(document.getElementById('view-dice').classList.contains('active')) dStatus.innerHTML = `<span style="color:#ff4d4d;">ПРОИГРЫШ</span>`;
                    } else {
                        balance += bet; updateBalance();
                        notify(`Кости: Ничья (${p1} vs ${p2}). Возврат.`, 'info');
                        if(document.getElementById('view-dice').classList.contains('active')) dStatus.innerHTML = `<span style="color:#ff9800;">НИЧЬЯ</span>`;
                    }

                    // Сброс визуала через 3 сек
                    setTimeout(() => {
                        if(dTurn === 'P1') {
                            dP1S.innerText = "-"; dP2S.innerText = "-"; dStatus.innerText = "Сделай ставку и брось";
                        }
                    }, 3000);

                }, 2000); // Бот "думает" 2 секунды
            }, 1000);
        }


        // --- ЛОГИКА МОНЕТКА ---
        let coinBusy = false;
        function flipCoin(choice) {
            if (coinBusy) return;
            let bet = parseInt(document.getElementById('coinBetInput').value);
            if (bet < 10 || balance < bet) return notify("Ошибка ставки", 'danger');

            balance -= bet; updateBalance();
            coinBusy = true;
            const vis = document.getElementById('coinVisual');
            const stat = document.getElementById('coinStatus');
            vis.classList.add('coin-flip'); stat.innerText = "Крутим...";

            setTimeout(() => {
                vis.classList.remove('coin-flip');
                let res = Math.random() < 0.5 ? 'Орел' : 'Решка';
                vis.innerText = res === 'Орел' ? '🦅' : '👑';
                
                if (res === choice) {
                    balance += bet * 2; updateBalance();
                    notify(`Монетка: ${res}! +${bet*2} 🪙`, 'success');
                    if(document.getElementById('view-coin').classList.contains('active')) stat.innerHTML = `<span style="color:#4CAF50;">Выигрыш! ${res}</span>`;
                } else {
                    notify(`Монетка: ${res}! Проигрыш.`, 'danger');
                    if(document.getElementById('view-coin').classList.contains('active')) stat.innerHTML = `<span style="color:#ff4d4d;">Проигрыш. ${res}</span>`;
                }
                coinBusy = false;
            }, 1500);
        }

        // Инициализация
        updateBalance();
        startCrash();
    </script>
</body>
</html>
