<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Номера</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');
        :root {
            --bg: #050505; --card: #111111; --text: #ffffff; --text-muted: #888888;
            --accent: #3b82f6; --gold: #fbbf24; --border: rgba(255,255,255,0.06);
            --danger: #ef4444; --success: #10b981; 
            --radius-lg: 20px; --radius-md: 14px; --radius-sm: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(to bottom, #0f172a, #000); }
        
        .top-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); border-bottom: 1px solid var(--border); }
        .balance { font-size: 16px; font-weight: 800; color: var(--gold); }
        
        .games-container { flex: 1; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; }
        .game-tabs { display: flex; gap: 5px; margin-bottom: 20px; background: var(--card); padding: 5px; border-radius: var(--radius-md); }
        .game-tab { flex: 1; padding: 12px 5px; text-align: center; font-size: 12px; font-weight: 800; color: var(--text-muted); cursor: pointer; border-radius: var(--radius-sm); transition: 0.2s; }
        .game-tab.active { background: rgba(59, 130, 246, 0.2); color: var(--accent); }

        .lobby-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .lobby-item { background: var(--card); padding: 15px; border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); cursor: pointer; }
        .lobby-info h4 { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
        .lobby-info p { font-size: 11px; color: var(--text-muted); }
        .lobby-bet { text-align: right; }
        .lobby-amount { font-size: 16px; font-weight: 800; color: var(--gold); }
        .lobby-win { font-size: 10px; color: var(--success); font-weight: 700; }

        .game-board { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; background: var(--card); border-radius: var(--radius-lg); padding: 20px; border: 1px solid var(--border); }
        .game-board.active { display: flex; }
        
        .players { display: flex; justify-content: space-between; width: 100%; margin-bottom: 30px; }
        .player { text-align: center; width: 45%; }
        .player .name { font-size: 12px; font-weight: 800; margin-top: 5px; }
        .player .label { font-size: 10px; color: var(--text-muted); }
        
        .visual { font-size: 80px; margin: 20px 0; }
        .dice-pair { display: flex; gap: 20px; }
        .status-text { font-size: 14px; font-weight: 800; color: var(--text-muted); margin-bottom: 20px; text-align: center; }
        
        .game-stats { width: 100%; background: rgba(0,0,0,0.4); border-radius: var(--radius-md); padding: 15px; margin-bottom: 20px; border: 1px solid var(--border); }
        .stat-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .stat-row:last-child { margin-bottom: 0; }
        .stat-row span:first-child { color: var(--text-muted); }
        .stat-row span:last-child { color: white; font-weight: 800; }

        .btn-main { background: var(--accent); color: white; border: none; border-radius: var(--radius-md); padding: 18px; font-size: 16px; font-weight: 800; width: 100%; cursor: pointer; text-transform: uppercase; transition: 0.2s; margin-bottom: 10px; }
        .btn-main:active { transform: scale(0.96); }
        .btn-main:disabled { background: rgba(255,255,255,0.1); color: var(--text-muted); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: none; border-radius: var(--radius-md); padding: 15px; font-size: 14px; font-weight: 800; width: 100%; cursor: pointer; }
        
        .input-bet { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: white; border-radius: var(--radius-md); padding: 15px; font-size: 18px; font-weight: 900; outline: none; margin-bottom: 15px; text-align: center; }

        .crash-container { display: flex; flex-direction: column; height: 100%; }
        .crash-graph { width: 100%; height: 200px; background: #000; border-radius: var(--radius-lg); position: relative; overflow: hidden; border: 1px solid var(--border); margin-bottom: 15px; }
        .crash-mult { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 48px; font-weight: 900; color: white; z-index: 2; }
        
    </style>
</head>
<body>
    <div class="top-header">
        <div style="font-weight: 900; font-size: 18px;">TrillCASINO</div>
        <div class="balance">🪙 <span id="userBalance">5000</span></div>
    </div>

    <div class="games-container">
        <div class="game-tabs">
            <div class="game-tab active" onclick="switchGame('coin', this)">Монетка</div>
            <div class="game-tab" onclick="switchGame('dice', this)">Кости</div>
            <div class="game-tab" onclick="switchGame('crash', this)">Краш</div>
        </div>

        <div id="pane-coin" class="game-pane">
            <div id="coin-lobby">
                <h3 style="margin-bottom: 15px;">Лобби (Монетка)</h3>
                <div id="coin-lobby-list" class="lobby-list"><p style="color: var(--text-muted); text-align: center;">Загрузка лотов...</p></div>
                <input type="number" id="coinBetInput" class="input-bet" value="1000">
                <button class="btn-main" onclick="createBet('coin')">Создать лот</button>
            </div>
            <div id="coin-game" class="game-board">
                <div class="players">
                    <div class="player"><div style="font-size: 40px;">👤</div><div class="name">Вы</div><div class="label">Игрок</div></div>
                    <div class="player"><div style="font-size: 40px;">?</div><div class="name" id="coin-opp-name">Ожидание</div><div class="label">Соперник</div></div>
                </div>
                <div class="visual" id="coin-visual">🪙</div>
                <div class="status-text" id="coin-status">Ожидание соперника...</div>
                <div class="game-stats">
                    <div class="stat-row"><span>Ставка</span><span id="coin-bet-disp">0</span></div>
                    <div class="stat-row"><span>Выигрыш</span><span id="coin-win-disp">0</span></div>
                </div>
                <button class="btn-main" id="coinThrowBtn" onclick="throwPvP(currentGameId, 'coin')" disabled>Бросить монетку</button>
                <button class="btn-secondary" onclick="leaveGame('coin')">Выйти</button>
            </div>
        </div>

        <div id="pane-dice" class="game-pane" style="display: none;">
            <div id="dice-lobby">
                <h3 style="margin-bottom: 15px;">Лобби (Кости)</h3>
                <div id="dice-lobby-list" class="lobby-list"><p style="color: var(--text-muted); text-align: center;">Загрузка лотов...</p></div>
                <input type="number" id="diceBetInput" class="input-bet" value="1000">
                <button class="btn-main" onclick="createBet('dice')">Создать лот</button>
            </div>
            <div id="dice-game" class="game-board">
                <div class="players">
                    <div class="player"><div style="font-size: 40px;">👤</div><div class="name">Вы</div><div class="label">Игрок</div></div>
                    <div class="player"><div style="font-size: 40px;">?</div><div class="name" id="dice-opp-name">Ожидание</div><div class="label">Соперник</div></div>
                </div>
                <div class="visual dice-pair"><div id="dice-1">🎲</div><div id="dice-2">🎲</div></div>
                <div class="status-text" id="dice-status">Ожидание соперника...</div>
                <div class="game-stats">
                    <div class="stat-row"><span>Ставка</span><span id="dice-bet-disp">0</span></div>
                    <div class="stat-row"><span>Выигрыш</span><span id="dice-win-disp">0</span></div>
                </div>
                <button class="btn-main" id="diceThrowBtn" onclick="throwPvP(currentGameId, 'dice')" disabled>Бросить кости</button>
                <button class="btn-secondary" onclick="leaveGame('dice')">Выйти</button>
            </div>
        </div>

        <div id="pane-crash" class="game-pane" style="display: none;">
            <div class="crash-container">
                <div class="crash-graph"><div class="crash-mult" id="crashMult">x1.00</div></div>
                <input type="number" id="crashBetInput" class="input-bet" value="1000">
                <button class="btn-main" id="crashBtn" onclick="playCrash()">Запустить</button>
            </div>
        </div>
    </div>

    <div id="toast" style="position: fixed; top: -50px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 10px 20px; border-radius: 20px; font-weight: 800; transition: top 0.3s; z-index: 1000;">Уведомление</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, get, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyALQK0FztkoJCDRc-dWgaWsOFrJyaBQUg", authDomain: "casino-numbers.firebaseapp.com", databaseURL: "https://casino-numbers-default-rtdb.firebaseio.com", projectId: "casino-numbers", storageBucket: "casino-numbers.firebasestorage.app", messagingSenderId: "163879101194", appId: "1:163879101194:web:90cd7c69d377327ae410f3" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.setHeaderColor("#050505");

        let currentUserName = "Игрок";
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) currentUserName = tg.initDataUnsafe.user.first_name || "Игрок";
        const myId = tg.initDataUnsafe?.user?.id || Math.floor(Math.random() * 1000000000);

        let balance = parseInt(localStorage.getItem('balance')) || 5000;
        let currentGameId = null;
        let isWaitingForOpponent = false;
        let myActiveBetId = null;
        let isCreator = false; 
        let betAmount = 0;
        let unsubMyBet = null;
        let unsubGame = null;

        function updateUI() {
            document.getElementById('userBalance').innerText = balance.toLocaleString('ru-RU');
            localStorage.setItem('balance', balance);
        }

        window.switchGame = function(pane, element) {
            document.querySelectorAll('.game-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.game-pane').forEach(p => p.style.display = 'none');
            element.classList.add('active');
            document.getElementById('pane-' + pane).style.display = 'flex';
            if (pane === 'coin') loadLobby('coin');
            if (pane === 'dice') loadLobby('dice');
        }

        function loadLobby(type) {
            onValue(ref(db, 'matchmaking'), (snapshot) => {
                const data = snapshot.val();
                const list = document.getElementById(`${type}-lobby-list`);
                if (!data) { list.innerHTML = `<p style="text-align: center; color: var(--text-muted);">Нет лотов</p>`; return; }
                let bets = Object.values(data).filter(b => b.type === type && b.status === 'waiting' && b.creatorId !== myId);
                
                if (bets.length === 0) { list.innerHTML = `<p style="text-align: center; color: var(--text-muted);">Нет лотов</p>`; return; }

                list.innerHTML = bets.map(bet => `
                    <div class="lobby-item" onclick="joinBet('${bet.id}', '${bet.type}')">
                        <div class="lobby-info"><h4>${bet.creatorName}</h4><p>в сети</p></div>
                        <div class="lobby-bet"><div class="lobby-amount">${bet.amount.toLocaleString('ru-RU')}</div><div class="lobby-win">выигрыш ${(bet.amount * 1.9).toLocaleString('ru-RU')}</div></div>
                    </div>
                `).join('');
            });
        }

        window.createBet = function(type) {
            if (currentGameId || isWaitingForOpponent) return;
            let bet = parseInt(document.getElementById(type + 'BetInput').value);
            if (!bet || bet < 100) return showToast('Мин. ставка 100');
            if (balance < bet) return showToast('Недостаточно монет!');

            balance -= bet; updateUI();
            betAmount = bet; isCreator = true;
            
            myActiveBetId = 'bet_' + myId + '_' + Date.now();
            set(ref(db, 'matchmaking/' + myActiveBetId), { id: myActiveBetId, creatorId: myId, creatorName: currentUserName, amount: bet, type: type, status: 'waiting', gameId: null }).then(() => {
                isWaitingForOpponent = true;
                document.getElementById(`${type}-lobby`).style.display = 'none';
                document.getElementById(`${type}-game`).style.display = 'flex';
                document.getElementById(`${type}-bet-disp`).innerText = bet.toLocaleString('ru-RU');
                document.getElementById(`${type}-win-disp`).innerText = (bet * 1.9).toLocaleString('ru-RU');
                document.getElementById(`${type}-status`).innerText = "Ожидание соперника...";
                
                if (unsubMyBet) unsubMyBet();
                unsubMyBet = onValue(ref(db, 'matchmaking/' + myActiveBetId), (snap) => {
                    const d = snap.val();
                    if (d && d.status === 'playing' && d.gameId) {
                        remove(ref(db, 'matchmaking/' + myActiveBetId));
                        isWaitingForOpponent = false;
                        currentGameId = d.gameId;
                        startGame(d.gameId, true, type, d.amount);
                    }
                });
            });
        }

        window.joinBet = function(betId, type) {
            if (currentGameId) return;
            get(ref(db, 'matchmaking/' + betId)).then((snap) => {
                const data = snap.val();
                if (!data || data.status !== 'waiting') return;
                if (balance < data.amount) return showToast('Недостаточно монет!');
                
                balance -= data.amount; updateUI();
                betAmount = data.amount; isCreator = false;
                
                const gameId = 'game_' + Date.now();
                const updates = {};
                updates['matchmaking/' + betId + '/status'] = 'playing';
                updates['matchmaking/' + betId + '/gameId'] = gameId;
                updates['games/' + gameId + '/player1'] = { id: data.creatorId, name: data.creatorName, bet: data.amount, score: 0, ready: false };
                updates['games/' + gameId + '/player2'] = { id: myId, name: currentUserName, bet: data.amount, score: 0, ready: false };
                updates['games/' + gameId + '/status'] = 'waiting_throw';
                updates['games/' + gameId + '/type'] = type;

                update(ref(db), updates).then(() => {
                    currentGameId = gameId;
                    startGame(gameId, false, type, data.amount);
                });
            });
        }

        function startGame(gameId, creator, type, amount) {
            isCreator = creator;
            document.getElementById(`${type}-lobby`).style.display = 'none';
            document.getElementById(`${type}-game`).style.display = 'flex';
            document.getElementById(`${type}-status`).innerText = "Соперник найден!";
            document.getElementById(`${type}-ThrowBtn`).disabled = false;
            
            if (unsubGame) unsubGame();
            unsubGame = onValue(ref(db, 'games/' + gameId), (snap) => {
                const data = snap.val();
                if (!data) return;
                let me = isCreator ? data.player1 : data.player2;
                let opp = isCreator ? data.player2 : data.player1;
                
                document.getElementById(`${type}-opp-name`).innerText = opp.name;
                
                if (data.status === 'finished') {
                    let myScore = me.score;
                    let oppScore = opp.score;
                    
                    if (type === 'coin') {
                        document.getElementById('coin-visual').innerText = myScore === 1 ? '🦅' : '🪙';
                    } else {
                        document.getElementById('dice-1').innerText = '🎲' + myScore;
                        document.getElementById('dice-2').innerText = '🎲' + oppScore;
                    }

                    if (myScore > oppScore) {
                        let win = Math.floor(amount * 1.9);
                        balance += win;
                        showToast(`Вы победили! +${win}`);
                    } else if (myScore === oppScore) {
                        balance += amount;
                        showToast('Ничья!');
                    } else {
                        showToast('Вы проиграли');
                    }
                    updateUI();
                    
                    currentGameId = null;
                    if (unsubGame) unsubGame();
                    setTimeout(() => {
                        document.getElementById(`${type}-lobby`).style.display = 'block';
                        document.getElementById(`${type}-game`).style.display = 'none';
                    }, 3000);
                }
            });
        }

        window.throwPvP = function(gameId, type) {
            if (!gameId) return;
            document.getElementById(`${type}-ThrowBtn`).disabled = true;
            get(ref(db, 'games/' + gameId)).then((snap) => {
                const data = snap.val();
                let myScore = type === 'coin' ? (Math.random() > 0.5 ? 1 : 0) : (Math.floor(Math.random() * 6) + 1);
                
                let updates = {};
                updates[(isCreator ? 'player1' : 'player2') + '/score'] = myScore;
                updates[(isCreator ? 'player1' : 'player2') + '/ready'] = true;
                if (data[(isCreator ? 'player2' : 'player1')].ready) updates['status'] = 'finished';
                
                update(ref(db, 'games/' + gameId), updates);
            });
        }

        window.leaveGame = function(type) {
            if (myActiveBetId) {
                balance += betAmount; updateUI(); 
                remove(ref(db, 'matchmaking/' + myActiveBetId));
            }
            if (unsubMyBet) unsubMyBet();
            if (unsubGame) unsubGame();
            myActiveBetId = null;
            currentGameId = null;
            isWaitingForOpponent = false;
            document.getElementById(`${type}-lobby`).style.display = 'block';
            document.getElementById(`${type}-game`).style.display = 'none';
        }

        let isCrashPlaying = false;
        window.playCrash = function() {
            if (isCrashPlaying) return;
            let bet = parseInt(document.getElementById('crashBetInput').value);
            if (!bet || bet < 100) return showToast('Мин. ставка 100');
            if (balance < bet) return showToast('Недостаточно монет!');
            
            balance -= bet; updateUI();
            isCrashPlaying = true;
            
            let mult = 1.0;
            let crashAt = Math.max(1.0, (0.99 / (1.0 - Math.random())));
            crashAt = Math.floor(crashAt * 100) / 100;
            if(crashAt < 1.01) crashAt = 1.01;

            let btn = document.getElementById('crashBtn');
            let multText = document.getElementById('crashMult');
            btn.innerText = 'Забрать (x1.00)';
            btn.style.background = 'var(--gold)';
            btn.style.color = 'black';
            btn.onclick = cashout;

            let interval = setInterval(() => {
                mult += 0.05;
                multText.innerText = 'x' + mult.toFixed(2);
                btn.innerText = `Забрать (x${mult.toFixed(2)})`;

                if (mult >= crashAt) {
                    clearInterval(interval);
                    isCrashPlaying = false;
                    multText.style.color = 'var(--danger)';
                    multText.innerText = 'УПАЛА x' + crashAt.toFixed(2);
                    btn.innerText = 'Запустить';
                    btn.style.background = 'var(--accent)';
                    btn.style.color = 'white';
                    btn.onclick = playCrash;
                }
            }, 100);

            function cashout() {
                if (!isCrashPlaying) return;
                clearInterval(interval);
                isCrashPlaying = false;
                let win = Math.floor(bet * mult);
                balance += win; updateUI();
                showToast('Забрали ' + win);
                
                multText.innerText = 'x' + mult.toFixed(2);
                multText.style.color = 'var(--success)';
                btn.innerText = 'Запустить';
                btn.style.background = 'var(--accent)';
                btn.style.color = 'white';
                btn.onclick = playCrash;
            }
        }

        window.showToast = function(text) {
            const t = document.getElementById('toast');
            t.innerText = text;
            t.style.top = '20px';
            setTimeout(() => t.style.top = '-50px', 2500);
        }

        updateUI();
        loadLobby('coin');
        loadLobby('dice');
    </script>
</body>
</html>
