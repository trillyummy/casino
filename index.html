<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrillCAZINO - Ultimate</title>
    <style>
        :root {
            --bg: #0f0f13; --card: #1e1e24; --primary: #007bff; --success: #4CAF50;
            --danger: #ff4d4d; --warning: #ff9800; --purple: #8e44ad; --text: #fff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* --- УВЕДОМЛЕНИЯ (PUSH) --- */
        #notification-area {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background: #2a2a35; color: white; padding: 15px; border-radius: 10px;
            border-left: 5px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: slideDown 0.3s ease-out forwards; font-weight: bold; font-size: 14px;
        }
        .toast.success { border-color: var(--success); }
        .toast.danger { border-color: var(--danger); }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* --- ШАПКА --- */
        .top-bar {
            padding: 15px; background: var(--card); display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid #333;
        }
        .balance { font-size: 20px; font-weight: bold; color: var(--success); }

        /* --- ВКЛАДКИ (НАВИГАЦИЯ) --- */
        .tabs { display: flex; background: var(--card); border-bottom: 1px solid #333; }
        .tab-btn {
            flex: 1; padding: 15px 0; background: none; border: none; color: #888;
            font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active { color: var(--text); border-bottom-color: var(--primary); }

        /* --- КОНТЕНТ --- */
        .content-area { flex: 1; overflow-y: auto; padding: 15px; position: relative; }
        .tab-content { display: none; flex-direction: column; height: 100%; animation: fadeIn 0.3s; }
        .tab-content.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- ОБЩИЕ ЭЛЕМЕНТЫ --- */
        .input-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .input-group label { font-size: 12px; color: #888; margin-bottom: 5px; display: flex; justify-content: space-between;}
        input[type="number"] {
            padding: 12px; border-radius: 10px; border: 1px solid #444; background: #111;
            color: white; font-size: 16px; font-weight: bold; outline: none;
        }
        .btn {
            padding: 15px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px;
            cursor: pointer; text-align: center; transition: 0.1s;
        }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-purple { background: var(--purple); color: white; }

        /* --- КРАШ --- */
        .crash-screen {
            height: 200px; background: #000; border-radius: 20px; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            border: 2px solid #222; position: relative; overflow: hidden; margin-bottom: 15px;
        }
        .crash-multiplier { font-size: 60px; font-weight: 800; z-index: 2; }
        .crash-multiplier.crashed { color: var(--danger); }
        .crash-rocket { font-size: 40px; position: absolute; bottom: 20px; left: 20px; z-index: 1; transition: transform 0.1s linear; }
        
        /* --- КОСТИ --- */
        .dice-arena {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 20px;
        }
        .dice-player { text-align: center; flex: 1; }
        .dice-display { font-size: 50px; margin: 10px 0; height: 60px; line-height: 60px; }
        .dice-vs { font-size: 20px; font-weight: bold; color: #666; margin: 0 15px; }
        .dice-shake { animation: shake 0.5s infinite; }
        @keyframes shake {
            0% { transform: rotate(0deg); } 25% { transform: rotate(15deg); }
            50% { transform: rotate(-15deg); } 75% { transform: rotate(10deg); } 100% { transform: rotate(0deg); }
        }

        /* --- МОНЕТКА --- */
        .coin-container {
            display: flex; flex-direction: column; align-items: center;
            background: var(--card); padding: 30px; border-radius: 20px; margin-bottom: 20px;
        }
        .coin {
            width: 100px; height: 100px; background: gold; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 50px; font-weight: bold; color: #b8860b;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px; transition: transform 0.5s;
        }
        .coin.flipping { animation: flip 0.5s infinite linear; }
        @keyframes flip { 0% { transform: rotateY(0); } 100% { transform: rotateY(360deg); } }

        /* --- SIM --- */
        .sim-card { background: var(--card); padding: 20px; border-radius: 20px; }
        .numbers-grid { display: flex; flex-wrap: wrap; gap: 8px; min-height: 50px; margin: 15px 0; }
        .number-item { background: #2a2a35; padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Контейнер уведомлений -->
    <div id="notification-area"></div>

    <!-- Шапка -->
    <div class="top-bar">
        <div>Баланс:</div>
        <div class="balance" id="balanceDisplay">0</div>
    </div>

    <!-- Навигация -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('crash', this)">Краш</button>
        <button class="tab-btn" onclick="switchTab('dice', this)">Кости</button>
        <button class="tab-btn" onclick="switchTab('coin', this)">Монетка</button>
        <button class="tab-btn" onclick="switchTab('sim', this)">SIM</button>
    </div>

    <!-- Основной контент -->
    <div class="content-area">

        <!-- ВКЛАДКА: КРАШ -->
        <div id="tab-crash" class="tab-content active">
            <div class="crash-screen">
                <div class="crash-multiplier" id="crashMultiplier">1.00x</div>
                <div class="crash-rocket" id="crashRocket">🚀</div>
            </div>
            
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <div class="input-group" style="flex:1; margin-bottom:0;">
                    <label>Сумма ставки</label>
                    <input type="number" id="crashBetInput" value="100" min="10" step="10">
                </div>
                <div class="input-group" style="flex:1; margin-bottom:0;">
                    <label>Автозабор (x) <span style="color:#666;font-size:10px;">[0=выкл]</span></label>
                    <input type="number" id="crashAutoCashoutInput" value="0" min="0" step="0.1">
                </div>
            </div>

            <button class="btn btn-primary" id="crashBetBtn" style="padding: 20px; font-size: 18px;">ПОСТАВИТЬ</button>
            <div id="crashStatus" style="text-align:center; margin-top:15px; color:#888; font-size:14px;">Ожидание следующего раунда...</div>
        </div>

        <!-- ВКЛАДКА: КОСТИ -->
        <div id="tab-dice" class="tab-content">
            <div class="dice-arena">
                <div class="dice-player">
                    <div style="font-size:12px; color:#888;">Игрок 1 (Ты)</div>
                    <div class="dice-display" id="diceP1">🎲</div>
                    <div id="diceP1Score" style="font-weight:bold; font-size:24px; color:var(--primary);">-</div>
                </div>
                <div class="dice-vs">VS</div>
                <div class="dice-player">
                    <div style="font-size:12px; color:#888;">Игрок 2 (Бот)</div>
                    <div class="dice-display" id="diceP2">🎲</div>
                    <div id="diceP2Score" style="font-weight:bold; font-size:24px; color:var(--danger);">-</div>
                </div>
            </div>
            
            <div class="input-group">
                <label>Ставка на кон (выигрыш забирает победитель)</label>
                <input type="number" id="diceBetInput" value="100" min="10" step="10">
            </div>
            <div style="display:flex; gap:10px; flex-direction:column;">
                <button class="btn btn-primary" id="diceRoll1Btn">ИГРОК 1: БРОСИТЬ</button>
                <button class="btn btn-warning" id="diceRoll2Btn" disabled>ИГРОК 2: БРОСИТЬ</button>
            </div>
            <div id="diceResult" style="text-align:center; margin-top:20px; font-weight:bold; font-size:18px;"></div>
        </div>

        <!-- ВКЛАДКА: МОНЕТКА -->
        <div id="tab-coin" class="tab-content">
            <div class="coin-container">
                <div class="coin" id="coinVisual">🪙</div>
                <div id="coinResult" style="font-weight:bold; font-size:20px; height:30px;"></div>
            </div>
            <div class="input-group">
                <label>Ставка</label>
                <input type="number" id="coinBetInput" value="100" min="10" step="10">
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-primary" style="flex:1;" onclick="flipCoin('Орел')">ОРЁЛ</button>
                <button class="btn btn-danger" style="flex:1;" onclick="flipCoin('Решка')">РЕШКА</button>
            </div>
        </div>

        <!-- ВКЛАДКА: SIM -->
        <div id="tab-sim" class="tab-content">
            <div class="sim-card">
                <div style="color:#666; font-weight:bold; text-align:right; font-style:italic;">SIM</div>
                <div style="font-size:22px; font-weight:bold; margin-bottom:15px;">+0 000 000-00-00</div>
                
                <div class="numbers-grid" id="numbersGrid">
                    <div style="color:#555; width:100%; text-align:center;">Нет номеров</div>
                </div>

                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <button class="btn btn-primary" style="flex:2;" onclick="scanX5()">СКАНИРОВАТЬ X5</button>
                </div>
                
                <div class="input-group">
                    <label>Сумма апгрейда (за 5 номеров)</label>
                    <input type="number" id="upgradeAmountInput" value="500" min="100" step="100">
                </div>
                <button class="btn btn-purple" id="upgradeBtn" style="width:100%;" disabled onclick="doUpgrade()">АПГРЕЙД (Нужно 5 номеров)</button>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // ГЛОБАЛЬНОЕ СОСТОЯНИЕ
        // ==========================================
        let balance = 1000;
        let currentTab = 'crash';
        let inventory = [];

        // DOM Элементы
        const balanceDisplay = document.getElementById('balanceDisplay');
        const notifArea = document.getElementById('notification-area');

        // ==========================================
        // УТИЛИТЫ (УВЕДОМЛЕНИЯ, НАВИГАЦИЯ)
        // ==========================================
        function updateBalance() {
            balanceDisplay.innerText = balance.toFixed(0);
        }

        function showNotification(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            notifArea.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideDown 0.3s ease-in reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            btnElement.classList.add('active');
            currentTab = tabId;
        }

        // ==========================================
        // 1. ЛОГИКА КРАШ (С АВТОЗАБОРОМ)
        // ==========================================
        let crashState = 'WAITING'; 
        let crashMultiplier = 1.00;
        let crashBet = 0;
        let currentAutoCashout = 0; // Переменная для хранения автозабора
        let crashInterval = null;

        const crashMultDisplay = document.getElementById('crashMultiplier');
        const crashBtn = document.getElementById('crashBetBtn');
        const crashStatus = document.getElementById('crashStatus');
        const crashRocket = document.getElementById('crashRocket');

        function startCrashWaiting() {
            crashState = 'WAITING';
            crashMultiplier = 1.00;
            crashBet = 0;
            currentAutoCashout = 0; // Сбрасываем автозабор на новый раунд
            
            crashMultDisplay.innerText = "1.00x";
            crashMultDisplay.classList.remove('crashed');
            crashRocket.innerText = "🚀";
            crashRocket.style.transform = `translate(0px, 0px)`;
            
            crashBtn.disabled = false;
            crashBtn.className = "btn btn-primary";
            crashBtn.innerText = "ПОСТАВИТЬ";
            crashStatus.innerText = "Ожидание ставок (5 сек)...";

            setTimeout(() => {
                if (crashState === 'WAITING') startCrashFlying();
            }, 5000);
        }

        function startCrashFlying() {
            crashState = 'FLYING';
            crashStatus.innerText = "В ПОЛЕТЕ!";
            
            if (crashBet > 0) {
                crashBtn.className = "btn btn-warning";
                crashBtn.innerText = currentAutoCashout > 0 ? `АВТОЗАБОР НА ${currentAutoCashout}x` : "ЗАБРАТЬ";
                crashBtn.disabled = currentAutoCashout > 0 ? true : false; // Если включен автозабор, кнопку блочим
            } else {
                crashBtn.disabled = true;
                crashBtn.innerText = "НЕ УСПЕЛ";
            }

            crashInterval = setInterval(() => {
                if (crashState !== 'FLYING') return;
                
                crashMultiplier += 0.05;
                crashMultDisplay.innerText = crashMultiplier.toFixed(2) + "x";
                
                let moveX = (crashMultiplier - 1) * 15;
                let moveY = (crashMultiplier - 1) * 8;
                crashRocket.style.transform = `translate(${Math.min(moveX, 200)}px, ${-Math.min(moveY, 100)}px)`;

                // ПРОВЕРКА АВТОЗАБОРА
                if (crashBet > 0 && currentAutoCashout > 0 && crashMultiplier >= currentAutoCashout) {
                    executeCashout(currentAutoCashout, true);
                    return; // Выходим из функции, чтобы не сработал краш
                }

                // Рандомный краш
                if (crashMultiplier > 1.5 && Math.random() < 0.02) {
                    crashCrash();
                }
            }, 100);
        }

        function executeCashout(multiplier, isAuto = false) {
            if (crashState !== 'FLYING' || crashBet <= 0) return;

            crashState = 'CRASHED'; 
            clearInterval(crashInterval);
            
            let winAmount = Math.floor(crashBet * multiplier);
            balance += winAmount;
            updateBalance();
            
            crashBtn.disabled = true;
            crashBtn.className = "btn btn-success";
            crashBtn.innerText = `ЗАБРАНО ${multiplier.toFixed(2)}x`;
            crashStatus.innerText = `Выигрыш: +${winAmount}`;
            
            crashMultDisplay.innerText = "ЗАБРАНО!";
            crashMultDisplay.classList.add('crashed'); // Красим в красный/зеленый
            crashMultDisplay.style.color = "var(--success)";
            crashRocket.innerText = "💰";

            let msg = isAuto 
                ? `🤖 АВТОЗАБОР ${multiplier.toFixed(2)}x! +${winAmount} 💰` 
                : `Вы забрали на ${multiplier.toFixed(2)}x! +${winAmount} 💰`;
            
            showNotification(msg, 'success');
            setTimeout(startCrashWaiting, 3000);
        }

        function crashCrash() {
            crashState = 'CRASHED';
            clearInterval(crashInterval);
            crashMultDisplay.innerText = "КРАШ!";
            crashMultDisplay.style.color = ""; // Сброс
            crashMultDisplay.classList.add('crashed');
            crashRocket.innerText = "💥";
            crashBtn.disabled = true;
            
            if (crashBet > 0) {
                crashBtn.className = "btn btn-danger";
                crashBtn.innerText = "ПРОИГРАЛ";
                if (currentTab !== 'crash') {
                    showNotification(`Краш! Вы потеряли ${crashBet} 💰`, 'danger');
                }
            } else {
                crashBtn.innerText = "ИГРА ОКОНЧЕНА";
            }
            crashStatus.innerText = "Ракета взорвалась";

            setTimeout(startCrashWaiting, 3000);
        }

        crashBtn.addEventListener('click', () => {
            if (crashState === 'WAITING') {
                let betVal = parseInt(document.getElementById('crashBetInput').value);
                if (isNaN(betVal) || betVal < 10) return showNotification("Мин. ставка 10", "danger");
                if (balance < betVal) return showNotification("Недостаточно средств", "danger");

                // Читаем автозабор
                let autoVal = parseFloat(document.getElementById('crashAutoCashoutInput').value);
                currentAutoCashout = (autoVal >= 1.01) ? autoVal : 0;

                balance -= betVal;
                crashBet = betVal;
                updateBalance();
                
                crashBtn.disabled = true;
                crashBtn.innerText = currentAutoCashout > 0 
                    ? `ЖДЕМ ${currentAutoCashout}x (АВТО)` 
                    : "СТАВКА ПРИНЯТА";
            } 
            else if (crashState === 'FLYING' && crashBet > 0 && currentAutoCashout === 0) {
                // Ручной забор
                executeCashout(crashMultiplier, false);
            }
        });

        // ==========================================
        // 2. ЛОГИКА КОСТИ (PVP)
        // ==========================================
        let diceState = 'P1_ROLL'; 
        let diceP1 = 0;
        let diceP2 = 0;
        let dicePot = 0;

        const diceP1Display = document.getElementById('diceP1');
        const diceP2Display = document.getElementById('diceP2');
        const diceP1Score = document.getElementById('diceP1Score');
        const diceP2Score = document.getElementById('diceP2Score');
        const diceResult = document.getElementById('diceResult');
        const roll1Btn = document.getElementById('diceRoll1Btn');
        const roll2Btn = document.getElementById('diceRoll2Btn');

        function resetDice() {
            diceState = 'P1_ROLL';
            diceP1 = 0; diceP2 = 0; dicePot = 0;
            diceP1Display.innerText = "🎲"; diceP2Display.innerText = "🎲";
            diceP1Display.classList.remove('dice-shake');
            diceP2Display.classList.remove('dice-shake');
            diceP1Score.innerText = "-"; diceP2Score.innerText = "-";
            diceResult.innerText = "";
            roll1Btn.disabled = false;
            roll2Btn.disabled = true;
        }

        roll1Btn.addEventListener('click', () => {
            if (diceState !== 'P1_ROLL') return;
            let bet = parseInt(document.getElementById('diceBetInput').value);
            if (balance < bet) return showNotification("Недостаточно средств", "danger");
            if (bet < 10) return showNotification("Мин. ставка 10", "danger");

            balance -= bet;
            dicePot = bet;
            updateBalance();
            
            roll1Btn.disabled = true;
            diceP1Display.classList.add('dice-shake');
            
            setTimeout(() => {
                diceP1Display.classList.remove('dice-shake');
                diceP1 = Math.floor(Math.random() * 6) + 1 + Math.floor(Math.random() * 6) + 1;
                diceP1Display.innerText = "🎲";
                diceP1Score.innerText = diceP1;
                
                diceState = 'P2_ROLL';
                roll2Btn.disabled = false;
            }, 1000);
        });

        roll2Btn.addEventListener('click', () => {
            if (diceState !== 'P2_ROLL') return;
            
            roll2Btn.disabled = true;
            diceP2Display.classList.add('dice-shake');
            
            setTimeout(() => {
                diceP2Display.classList.remove('dice-shake');
                diceP2 = Math.floor(Math.random() * 6) + 1 + Math.floor(Math.random() * 6) + 1;
                diceP2Display.innerText = "🎲";
                diceP2Score.innerText = diceP2;
                
                diceState = 'RESULT';
                checkDiceWinner();
            }, 1000);
        });

        function checkDiceWinner() {
            if (diceP1 > diceP2) {
                balance += dicePot * 2;
                updateBalance();
                diceResult.innerHTML = `<span style="color:var(--success);">Игрок 1 ПОБЕДИЛ! (${diceP1} vs ${diceP2}) +${dicePot*2} 💰</span>`;
                showNotification(`Победа в костях! +${dicePot*2} 💰`, 'success');
            } else if (diceP2 > diceP1) {
                diceResult.innerHTML = `<span style="color:var(--danger);">Игрок 2 ПОБЕДИЛ! (${diceP2} vs ${diceP1})</span>`;
                showNotification(`Вы проиграли в костях (${diceP1} vs ${diceP2})`, 'danger');
            } else {
                balance += dicePot;
                updateBalance();
                diceResult.innerHTML = `<span style="color:var(--warning);">НИЧЬЯ! (${diceP1} vs ${diceP2}) Ставка возвращена.</span>`;
                showNotification(`Ничья в костях! Ставка возвращена.`, 'info');
            }
            
            setTimeout(resetDice, 4000);
        }

        // ==========================================
        // 3. ЛОГИКА МОНЕТКА
        // ==========================================
        let coinIsFlipping = false;
        const coinVisual = document.getElementById('coinVisual');
        const coinResult = document.getElementById('coinResult');

        function flipCoin(choice) {
            if (coinIsFlipping) return;
            
            let bet = parseInt(document.getElementById('coinBetInput').value);
            if (balance < bet) return showNotification("Недостаточно средств", "danger");
            if (bet < 10) return showNotification("Мин. ставка 10", "danger");

            balance -= bet;
            updateBalance();

            coinIsFlipping = true;
            coinVisual.classList.add('flipping');
            coinResult.innerText = "Крутим...";
            
            setTimeout(() => {
                coinVisual.classList.remove('flipping');
                let result = Math.random() < 0.5 ? 'Орел' : 'Решка';
                coinVisual.innerText = result === 'Орел' ? '🦅' : '👑';
                
                if (result === choice) {
                    balance += bet * 2;
                    updateBalance();
                    coinResult.innerHTML = `<span style="color:var(--success);">${result}! Вы выиграли ${bet*2} 💰</span>`;
                    showNotification(`Монетка: ${result}! +${bet*2} 💰`, 'success');
                } else {
                    coinResult.innerHTML = `<span style="color:var(--danger);">${result}! Вы проиграли.</span>`;
                    showNotification(`Монетка: ${result}! Вы проиграли.`, 'danger');
                }
                
                coinIsFlipping = false;
            }, 1500);
        }

        // ==========================================
        // 4. ЛОГИКА SIM И АПГРЕЙД
        // ==========================================
        const numbersGrid = document.getElementById('numbersGrid');
        const upgradeBtn = document.getElementById('upgradeBtn');

        function renderInventory() {
            if (inventory.length === 0) {
                numbersGrid.innerHTML = '<div style="color:#555; width:100%; text-align:center;">Нет номеров</div>';
            } else {
                numbersGrid.innerHTML = '';
                inventory.forEach(num => {
                    let div = document.createElement('div');
                    div.className = 'number-item';
                    div.innerText = num;
                    numbersGrid.appendChild(div);
                });
            }

            if (inventory.length >= 5) {
                upgradeBtn.disabled = false;
            } else {
                upgradeBtn.disabled = true;
            }
        }

        function scanX5() {
            if (inventory.length >= 50) return showNotification("Инвентарь полон (макс 50)", "danger");
            
            for (let i = 0; i < 5; i++) {
                let num = "+7 9";
                for (let j = 0; j < 9; j++) {
                    num += Math.floor(Math.random() * 10);
                    if (j === 2 || j === 5 || j === 7) num += "-";
                }
                inventory.push(num);
            }
            renderInventory();
            showNotification("Отсканировано 5 номеров!", 'info');
        }

        function doUpgrade() {
            if (inventory.length < 5) return;
            
            let upgAmount = parseInt(document.getElementById('upgradeAmountInput').value);
            if (isNaN(upgAmount) || upgAmount < 100) return showNotification("Мин. апгрейд 100", "danger");
            if (balance < upgAmount) return showNotification("Недостаточно средств для апгрейда", "danger");

            inventory.splice(0, 5);
            balance -= upgAmount;
            updateBalance();
            renderInventory();
            
            let profit = Math.floor(Math.random() * (upgAmount * 2)) + upgAmount;
            balance += profit;
            updateBalance();
            
            showNotification(`Апгрейд успешен! Потрачено ${upgAmount}, получено ${profit} 💰`, 'success');
        }

        // ==========================================
        // ИНИЦИАЛИЗАЦИЯ
        // ==========================================
        updateBalance();
        startCrashWaiting();

    </script>
</body>
</html>
