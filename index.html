<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background: #000; color: #fff; font-family: sans-serif; padding: 20px;">
    <h1>Тест Firebase</h1>
    <button onclick="testDb()" style="padding: 20px; font-size: 20px;">Создать лот</button>
    <div id="log" style="margin-top: 20px; color: #00ff00;">Ожидание...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyALQK0FztkoJCDRc-dWgaWsOFrJyaBQUg", 
            authDomain: "casino-numbers.firebaseapp.com", 
            databaseURL: "https://casino-numbers-default-rtdb.firebaseio.com", 
            projectId: "casino-numbers", 
            storageBucket: "casino-numbers.firebasestorage.app", 
            messagingSenderId: "163879101194", 
            appId: "1:163879101194:web:90cd7c69d377327ae410f3" 
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.testDb = function() {
            document.getElementById('log').innerText = "Отправка...";
            const testRef = ref(db, 'matchmaking/test_lot_123');
            set(testRef, {
                creatorName: "TestUser",
                amount: 1000,
                status: "waiting"
            }).then(() => {
                document.getElementById('log').innerText = "УСПЕХ! Лот записан в базу.";
                document.getElementById('log').style.color = "#00ff00";
            }).catch((error) => {
                document.getElementById('log').innerText = "ОШИБКА: " + error.message;
                document.getElementById('log').style.color = "#ff0000";
            });
        }
    </script>
</body>
</html>
