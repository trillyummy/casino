    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, get, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyALQK0FztkoJCDRc-dWgaWsOFrJyaBQUg", 
            authDomain: "casino-numbers.firebaseapp.com", 
            databaseURL: "https://casino-numbers-default-rtdb.firebaseio.com", 
            projectId: "casino-numbers", 
            storageBucket: "casino-numbers.firebasestorage.app", 
            messagingSenderId: "163879101194", 
            appId: "1:163879101194:web:90cd7c69d377327ae410f3" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.setHeaderColor("#050505");

        let currentUserName = "Игрок";
        let currentUserAvatar = "👤";
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            currentUserName = tg.initDataUnsafe.user.first_name || "Игрок";
            if(tg.initDataUnsafe.user.photo_url) {
                currentUserAvatar = `<img src="${tg.initDataUnsafe.user.photo_url}" style="width:100%; height:100%; object-fit:cover;">`;
            }
        }
        const myId = tg.initDataUnsafe?.user?.id || Math.floor(Math.random() * 1000000000);

        // --- СОСТОЯНИЯ ---
        let balance = parseInt(localStorage.getItem('casino_balance')) || 5000;
        let inventory = JSON.parse(localStorage.getItem('casino_inventory')) || [];
        let statOpened = parseInt(localStorage.getItem('stat_opened')) || 0;
        let userLevel = parseInt(localStorage.getItem('user_level')) || 1;
        let userXp = parseInt(localStorage.getItem('user_xp')) || 0;
        let isSpinning = false;
        let isX5Active = false;
        let currentTier = { key: 'grey', cost: 500, name: 'Серый рынок' };
        
        let autoSellSettings = JSON.parse(localStorage.getItem('auto_sell_settings')) || { "Обычный": false, "Необычный": false, "Редкий": false, "Эпический": false, "Легендарный": false, "Мифический": false };

        let currentCountry = { code: "any", flag: "🌍 Любая", prefix: null };
        const countries = [
            { code: "any", flag: "🌍 Любая", prefix: null },
            { code: "+7", flag: "🇷🇺 Россия", prefix: 7 }, { code: "+375", flag: "🇧🇾 Беларусь", prefix: 375 }, { code: "+380", flag: "🇺🇦 Украина", prefix: 380 }, { code: "+1", flag: "🇺🇸 США", prefix: 1 }, { code: "+49", flag: "🇩🇪 Германия", prefix: 49 }, { code: "+44", flag: "🇬🇧 Англия", prefix: 44 }, { code: "+971", flag: "🇦🇪 ОАЭ", prefix: 971 }
        ];
        
        let rocketHistory = JSON.parse(localStorage.getItem('rocket_history')) || [];
        let rocketBet = 5000;
        let rocketState = 'idle'; 
        let rocketMult = 1.0;
        let rocketInterval = null;
        let currentCrashPoint = 0;
        let hasCashedOut = false;
        let rocketTime = 0;
        let autoCashout = 0;

        // --- PVP ---
        let myActiveBetId = null;
        let currentGameId = null;
        let isWaitingForOpponent = false;
        let unsubMyBet = null;
        let unsubGame = null;
        let mmListenerInterval = null;

        const promoCodes = { "SIMCITY": 100000, "LUCKY": 50000, "CASINO": 25000 };
        let usedPromos = JSON.parse(localStorage.getItem('used_promos')) || [];

        const tierChances = {
            grey: { Обычный: 60, Необычный: 25, Редкий: 10, Эпический: 4, Легендарный: 0.9, Мифический: 0.1 },
            hacker: { Обычный: 30, Необычный: 40, Редкий: 20, Эпический: 8, Легендарный: 1.8, Мифический: 0.2 },
            vip: { Обычный: 0, Необычный: 30, Редкий: 40, Эпический: 20, Легендарный: 8, Мифический: 2 },
            gov: { Обычный: 0, Необычный: 0, Редкий: 40, Эпический: 35, Легендарный: 20, Мифический: 5 }
        };
        const baseRarities = { "Обычный": { color: "#8b92a5", price: 150 }, "Необычный": { color: "#10b981", price: 500 }, "Редкий": { color: "#3b82f6", price: 2000 }, "Эпический": { color: "#8b5cf6", price: 10000 }, "Легендарный": { color: "#f97316", price: 50000 }, "Мифический": { color: "#fbbf24", price: 500000 } };

        function updateUI() {
            document.getElementById('userBalance').innerText = balance.toLocaleString('ru-RU');
            document.getElementById('statOpened').innerText = statOpened;
            document.getElementById('statValue').innerText = inventory.reduce((sum, item) => sum + item.price, 0).toLocaleString('ru-RU');
            let xpNeeded = userLevel * 100;
            document.getElementById('userLevel').innerText = userLevel;
            document.getElementById('headerLvl').innerText = userLevel;
            document.getElementById('headerLvlBar').style.width = `${(userXp / xpNeeded) * 100}%`;
            document.getElementById('userXpText').innerText = `${userXp} / ${xpNeeded} XP`;
            document.getElementById('userXpBar').style.width = `${(userXp / xpNeeded) * 100}%`;
            let untilGuarantee = 1000 - (statOpened % 1000);
            if(untilGuarantee === 1000 && statOpened > 0) untilGuarantee = 0;
            document.getElementById('guaranteeCount').innerText = untilGuarantee;

            localStorage.setItem('casino_balance', balance);
            localStorage.setItem('casino_inventory', JSON.stringify(inventory));
            localStorage.setItem('stat_opened', statOpened);
            localStorage.setItem('user_level', userLevel);
            localStorage.setItem('user_xp', userXp);
            localStorage.setItem('rocket_history', JSON.stringify(rocketHistory));
            localStorage.setItem('used_promos', JSON.stringify(usedPromos));
            localStorage.setItem('auto_sell_settings', JSON.stringify(autoSellSettings));
            
            updateRocketHistoryUI();
            checkBetButton();
            renderBattlePass();
        }

        window.toggleMenu = function() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        window.switchTab = function(tabId, element) {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('sidebarOverlay').classList.remove('active');
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.menu-item, .menu-box-btn, .small-btn, .wide-btn').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-' + tabId).classList.add('active');
            if(element) element.classList.add('active');
            
            if(tabId === 'inventory') renderInventory();
            if(tabId === 'chances') renderChances();
            if(tabId === 'settings') loadAutoSellSettings();
        }

        window.loadAutoSellSettings = function() {
            for (let rarity in autoSellSettings) {
                let el = document.getElementById('auto-sell-' + rarity);
                if (el) el.checked = autoSellSettings[rarity];
            }
        }

        window.saveAutoSell = function() {
            for (let rarity in autoSellSettings) {
                let el = document.getElementById('auto-sell-' + rarity);
                if (el) autoSellSettings[rarity] = el.checked;
            }
            localStorage.setItem('auto_sell_settings', JSON.stringify(autoSellSettings));
            showToast('Настройки сохранены', '⚙️');
        }

        window.openTariffModal = function() { document.getElementById('tariffModal').classList.add('active'); }
        window.closeTariffModal = function() { document.getElementById('tariffModal').classList.remove('active'); }
        window.selectTier = function(key, el, cost) {
            currentTier = { key, cost, name: el.querySelector('h4').innerText };
            document.querySelectorAll('.tariff-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('currentTierName').innerText = currentTier.name;
            document.getElementById('currentTierCost').innerText = cost.toLocaleString('ru-RU') + ' 🪙';
            closeTariffModal();
        }

        window.openRoamingModal = function() { document.getElementById('roamingModal').classList.add('active'); }
        window.closeRoamingModal = function() { document.getElementById('roamingModal').classList.remove('active'); }
        function renderRoaming() {
            const grid = document.getElementById('countryGrid');
            grid.innerHTML = countries.map(c => `
                <div class="country-item ${currentCountry.code === c.code ? 'active' : ''}" onclick="selectCountry('${c.code}')">
                    <span>${c.flag.split(' ')[0]}</span><p>${c.flag.split(' ')[1]}</p>
                </div>
            `).join('');
        }
        window.selectCountry = function(code) {
            currentCountry = countries.find(c => c.code === code);
            document.getElementById('currentRoamingText').innerText = currentCountry.flag;
            renderRoaming(); closeRoamingModal(); showToast(`Роуминг: ${currentCountry.flag}`, '🌍');
        }

        function generatePhoneNumber() {
            let code = currentCountry.prefix;
            if (!code) { let randomCountry = countries[Math.floor(Math.random() * (countries.length - 1)) + 1]; code = randomCountry.prefix; }
            let p1 = Math.floor(Math.random() * 900) + 100; let p2 = Math.floor(Math.random() * 90) + 10; let p3 = Math.floor(Math.random() * 90) + 10;
            return `+${code} ${p1} ${p2}-${p3}`;
        }

        function renderChances() {
            const list = document.getElementById('chancesList');
            let chances = tierChances[currentTier.key];
            list.innerHTML = Object.entries(chances).map(([name, chance]) => `
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px;">
                    <span style="color: ${baseRarities[name].color};">${name}</span><span>${chance.toFixed(2)}%</span>
                </div>
            `).join('');
        }

        window.toggleX5 = function() {
            if (isSpinning) return;
            isX5Active = !isX5Active;
            const btn = document.getElementById('spinBtnX5');
            if (isX5Active) { btn.classList.add('active'); btn.innerText = 'x5 (ВКЛ)'; } else { btn.classList.remove('active'); btn.innerText = 'x5'; }
        }

        window.handleSpin = function() {
            if (isSpinning) return;
            let count = isX5Active ? 5 : 1;
            let totalCost = currentTier.cost * count;
            if (balance < totalCost) return showToast('Недостаточно монет!', '❌');
            
            balance -= totalCost; updateUI(); isSpinning = true;
            document.getElementById('simDashes').style.display = 'flex';
            document.getElementById('simResultBox').classList.remove('show');
            document.getElementById('simX5Grid').classList.remove('show');
            document.getElementById('simX5Grid').innerHTML = '';

            let spinTicks = 0;
            let interval = setInterval(() => {
                document.getElementById('simDashes').style.opacity = (spinTicks % 2 === 0) ? '1' : '0.3';
                spinTicks++;
                if (spinTicks > 20) { clearInterval(interval); isSpinning = false; finishSpin(count); }
            }, 75);
        }

        function generateNumberData() {
            let isGuarantee = false; if ((statOpened + 1) % 1000 === 0) isGuarantee = true;
            if (isGuarantee) return { number: generatePhoneNumber(), rarity: "СЕКРЕТНЫЙ (ГАРАНТ)", price: 100000000, color: "#ef4444" };
            let chances = tierChances[currentTier.key]; let random = Math.random() * 100; let selectedRarity = "Обычный"; let currentChance = 0;
            for (let [name, chance] of Object.entries(chances)) { currentChance += chance; if (random <= currentChance && chance > 0) { selectedRarity = name; break; } }
            const data = baseRarities[selectedRarity];
            return { number: generatePhoneNumber(), rarity: selectedRarity, price: data.price, color: data.color };
        }

        function finishSpin(count) {
            document.getElementById('simDashes').style.display = 'none';
            if (count === 1) {
                const item = generateNumberData(); statOpened++;
                document.getElementById('simResultBox').classList.add('show');
                document.getElementById('simResultNumber').innerText = item.number;
                document.getElementById('simResultNumber').style.color = item.color;
                document.getElementById('simResultRarity').innerText = item.rarity;
                document.getElementById('simResultRarity').style.color = item.color;
                document.getElementById('simResultPrice').innerText = `${item.price.toLocaleString('ru-RU')} 🪙`;
                if (autoSellSettings[item.rarity]) { balance += item.price; showToast(`Автопродажа: +${item.price.toLocaleString('ru-RU')} 🪙`, '💰'); } 
                else { inventory.push(item); showToast(`Номер в базе!`, '📦'); }
            } else {
                statOpened += count; let totalSold = 0; let totalAdded = 0; let results = [];
                for (let i = 0; i < count; i++) {
                    let item = generateNumberData(); results.push(item); statOpened++;
                    if (autoSellSettings[item.rarity]) { totalSold += item.price; } else { inventory.push(item); totalAdded++; }
                }
                balance += totalSold;
                let grid = document.getElementById('simX5Grid'); grid.classList.add('show');
                grid.innerHTML = results.map(item => `
                    <div class="sim-x5-item" style="border-left-color: ${item.color};">
                        <span>${item.number} <br><small style="color:${item.color}; font-size:9px;">${item.rarity}</small></span>
                        <span>${item.price.toLocaleString('ru-RU')} 🪙</span>
                    </div>
                `).join('');
                if (totalSold > 0) showToast(`Автопродажа: +${totalSold.toLocaleString('ru-RU')} 🪙`, '💰');
                if (totalAdded > 0) showToast(`В базу добавлено: ${totalAdded} шт.`, '📦');
            }
            updateUI();
        }

        function renderInventory() {
            const list = document.getElementById('inventoryList');
            if (inventory.length === 0) { list.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top:20px;">Твоя база пуста</p>`; return; }
            list.innerHTML = inventory.map((item, index) => `
                <div class="inventory-item" style="border-left-color: ${item.color};">
                    <div class="inv-info">
                        <h4 style="color: ${item.color};">${item.number}</h4><p>${item.rarity}</p>
                        <button class="btn-sell" onclick="sellItem(${index})">Продать за ${item.price.toLocaleString('ru-RU')} 🪙</button>
                    </div>
                </div>
            `).join('');
        }
        window.sellItem = function(index) { balance += inventory[index].price; inventory.splice(index, 1); updateUI(); renderInventory(); showToast('Продано!', '💰'); }
        window.sellAllNumbers = function() { if (inventory.length === 0) return; let total = inventory.reduce((sum, item) => sum + item.price, 0); balance += total; inventory = []; updateUI(); renderInventory(); showToast(`Продано всё за ${total.toLocaleString('ru-RU')} 🪙`, '💰'); }
        window.sellToBuyer = function() { if (inventory.length === 0) return showToast('База пуста!', '❌'); let total = inventory.reduce((sum, item) => sum + item.price, 0); let bonus = Math.floor(total * 1.2); balance += bonus; inventory = []; updateUI(); if(document.getElementById('screen-inventory').classList.contains('active')) renderInventory(); showToast(`Скупщик заплатил ${bonus.toLocaleString('ru-RU')} 🪙 (+20%)`, '🤑'); }

        window.activatePromo = function() {
            let input = document.getElementById('promoInput').value.trim().toUpperCase(); if (!input) return;
            if (usedPromos.includes(input)) return showToast('Ты уже использовал этот код!', '❌');
            if (promoCodes[input]) { balance += promoCodes[input]; usedPromos.push(input); updateUI(); document.getElementById('promoInput').value = ''; showToast(`Промокод активирован! +${promoCodes[input].toLocaleString('ru-RU')} 🪙`, '🎁'); } 
            else { showToast('Неверный промокод', '❌'); }
        }

        window.renderBattlePass = function() {
            let bpLvl = Math.floor(statOpened / 10) + 1;
            document.getElementById('bpLevelDisplay').innerText = bpLvl;
            const bpList = document.getElementById('bpList'); let html = '';
            for (let i = 1; i <= 50; i++) {
                let reqLvl = i; let isLocked = bpLvl < reqLvl; let isClaimed = localStorage.getItem('bp_claimed_' + i) === 'true'; let reward = i * 2500; 
                if (i % 10 === 0) reward = i * 10000; 
                html += `
                    <div class="bp-card" style="${isLocked ? 'opacity: 0.5;' : ''}">
                        <div><h4>Уровень ${reqLvl}</h4><p>Награда: ${reward.toLocaleString('ru-RU')} 🪙</p></div>
                        <div class="bp-reward">
                            <button class="btn-main" style="padding: 6px 10px; font-size: 10px; flex: none; ${isLocked || isClaimed ? 'background: rgba(255,255,255,0.1); color: #888;' : ''}" onclick="claimBP(${i}, ${reqLvl}, ${reward})" ${isLocked || isClaimed ? 'disabled' : ''}>${isClaimed ? 'Получено' : 'Забрать'}</button>
                        </div>
                    </div>
                `;
            }
            bpList.innerHTML = html;
        }
        window.claimBP = function(id, reqLvl, reward) { let bpLvl = Math.floor(statOpened / 10) + 1; if (bpLvl >= reqLvl) { balance += reward; localStorage.setItem('bp_claimed_' + id, 'true'); updateUI(); showToast(`Получено ${reward.toLocaleString('ru-RU')} 🪙`, '👑'); } }

        window.switchGamePane = function(paneId, element) {
            document.querySelectorAll('.game-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.game-pane').forEach(p => p.classList.remove('active'));
            if(element) element.classList.add('active');
            document.getElementById('pane-' + paneId).classList.add('active');
            
            if (paneId === 'crash') startBackgroundCrash(); else stopBackgroundCrash();
            if (paneId === 'coin') startMatchmakingListener('coin');
            if (paneId === 'dice') startMatchmakingListener('dice');
        }

        // --- PVP ЛОГИКА ---
        function startMatchmakingListener(type) {
            if (mmListenerInterval) clearInterval(mmListenerInterval);
            mmListenerInterval = setInterval(() => {
                if (currentGameId || isWaitingForOpponent) return;
                const mmRef = ref(db, 'matchmaking');
                get(mmRef).then((snapshot) => {
                    const data = snapshot.val();
                    if (!data) { resetGameUI(type); return; }
                    let bets = Object.values(data).filter(b => b.type === type && b.status === 'waiting' && b.creatorId !== myId);
                    if (bets.length > 0) {
                        let bet = bets[0];
                        let playBtn = document.getElementById(type + 'PlayBtn');
                        playBtn.innerText = `Принять (${bet.creatorName} на ${bet.amount} 🪙)`;
                        playBtn.onclick = () => acceptBet(bet.id, bet.type);
                        playBtn.classList.remove('disabled');
                        playBtn.disabled = false;
                    } else {
                        resetGameUI(type);
                    }
                }).catch(e => console.log(e));
            }, 2000);
        }

        window.createBet = function(type) {
            if (isWaitingForOpponent || currentGameId) return;
            let betInput = document.getElementById(type + 'BetInput');
            let bet = parseInt(betInput.value);
            if (!bet || bet < 100) return showToast('Минимальная ставка 100', '⚠️');
            if (balance < bet) return showToast('Недостаточно монет!', '❌');

            balance -= bet; updateUI();
            
            myActiveBetId = 'bet_' + myId + '_' + Date.now();
            const betData = { id: myActiveBetId, creatorId: myId, creatorName: currentUserName, creatorAvatar: currentUserAvatar, amount: bet, type: type, status: 'waiting', gameId: null, timestamp: Date.now() };

            set(ref(db, 'matchmaking/' + myActiveBetId), betData).then(() => {
                document.getElementById('searchOverlay').classList.add('active');
                document.getElementById('searchText').innerText = "Ожидание соперника...";
                isWaitingForOpponent = true;
                listenMyBet(myActiveBetId, type);
            }).catch(e => {
                showToast('Ошибка базы: ' + e.message, '❌');
                balance += bet; updateUI();
            });
        }

        function listenMyBet(betId, type) {
            if (unsubMyBet) unsubMyBet();
            const betRef = ref(db, 'matchmaking/' + betId);
            unsubMyBet = onValue(betRef, (snapshot) => {
                const data = snapshot.val();
                if (data && data.status === 'playing' && data.gameId) {
                    if (unsubMyBet) unsubMyBet();
                    remove(betRef);
                    isWaitingForOpponent = false;
                    document.getElementById('searchOverlay').classList.remove('active');
                    
                    if (currentGameId !== data.gameId) {
                        showToast(`Соперник найден! Зайдите в игру.`, '⚔️');
                        currentGameId = data.gameId;
                        startPvPGame(data.gameId, true, data.type, data.amount);
                    }
                }
            });
        }

        window.cancelSearch = function() {
            if (myActiveBetId) remove(ref(db, 'matchmaking/' + myActiveBetId));
            if (unsubMyBet) unsubMyBet();
            isWaitingForOpponent = false;
            myActiveBetId = null;
            document.getElementById('searchOverlay').classList.remove('active');
            
            let type = document.querySelector('.game-tab.active').innerText === 'Монетка' ? 'coin' : 'dice';
            let bet = parseInt(document.getElementById(type + 'BetInput').value) || 0;
            if (bet > 0) { balance += bet; updateUI(); } 
            resetGameUI(type);
            showToast('Поиск отменен, деньги возвращены', '❌');
        }

        window.acceptBet = function(betId, type) {
            if (currentGameId) return;
            const betRef = ref(db, 'matchmaking/' + betId);
            get(betRef).then((snapshot) => {
                const data = snapshot.val();
                if (!data || data.status !== 'waiting') return showToast('Лот уже занят', '❌');
                if (balance < data.amount) return showToast('Недостаточно монет!', '❌');
                
                balance -= data.amount; updateUI();
                const gameId = 'game_' + Date.now();
                
                const updates = {};
                updates['matchmaking/' + betId + '/status'] = 'playing';
                updates['matchmaking/' + betId + '/gameId'] = gameId;
                updates['games/' + gameId + '/player1'] = { id: data.creatorId, name: data.creatorName, avatar: data.creatorAvatar, bet: data.amount, score: 0, ready: false };
                updates['games/' + gameId + '/player2'] = { id: myId, name: currentUserName, avatar: currentUserAvatar, bet: data.amount, score: 0, ready: false };
                updates['games/' + gameId + '/type'] = data.type;
                updates['games/' + gameId + '/status'] = 'waiting_throw';

                update(ref(db), updates).then(() => {
                    currentGameId = gameId;
                    startPvPGame(gameId, false, data.type, data.amount);
                });
            });
        }

        function startPvPGame(gameId, isCreator, type, amount) {
            switchGamePane(type, document.querySelector(`.game-tab[onclick*="${type}"]`));
            
            let playBtn = document.getElementById(type + 'PlayBtn');
            playBtn.innerText = 'Бросить!';
            playBtn.onclick = () => throwPvP(gameId, type);
            playBtn.classList.remove('disabled');
            playBtn.disabled = false;
            
            document.getElementById(type + 'PlayerRes').innerText = '?';
            document.getElementById(type + 'OpponentRes').innerText = '?';
            
            if (unsubGame) unsubGame();
            const gameRef = ref(db, 'games/' + gameId);
            unsubGame = onValue(gameRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                
                let me = isCreator ? data.player1 : data.player2;
                let opp = isCreator ? data.player2 : data.player1;
                
                document.getElementById(type + 'OpponentName').innerText = opp.name;
                
                if (data.status === 'finished') {
                    let myScore = me.score;
                    let oppScore = opp.score;
                    
                    let resultEl = document.getElementById(type + 'PlayerRes');
                    let oppResultEl = document.getElementById(type + 'OpponentRes');
                    
                    if (type === 'coin') {
                        resultEl.innerText = myScore === 1 ? '🦅' : '🪙';
                        oppResultEl.innerText = oppScore === 1 ? '🦅' : '🪙';
                    } else {
                        resultEl.innerText = '🎲' + myScore;
                        oppResultEl.innerText = '🎲' + oppScore;
                    }

                    if (myScore > oppScore) {
                        let win = amount * 2;
                        balance += win;
                        showToast(`Вы победили! +${win} 🪙`, '🏆');
                    } else if (myScore === oppScore) {
                        balance += amount;
                        showToast('Ничья!', '🤝');
                    } else {
                        showToast('Вы проиграли.', '💀');
                    }
                    updateUI();
                    
                    currentGameId = null;
                    if (unsubGame) unsubGame();
                    setTimeout(() => resetGameUI(type), 4000);
                    return;
                }
                
                if (me.ready && !opp.ready) {
                    playBtn.innerText = 'Ожидание соперника...';
                    playBtn.disabled = true;
                    playBtn.classList.add('disabled');
                }
            });
        }

        function throwPvP(gameId, type) {
            let playBtn = document.getElementById(type + 'PlayBtn');
            playBtn.disabled = true;
            playBtn.classList.add('disabled');
            
            const gameRef = ref(db, 'games/' + gameId);
            get(gameRef).then((snapshot) => {
                const data = snapshot.val();
                if(!data) return;
                const isCreator = data.player1.id === myId;
                let myScore = type === 'coin' ? (Math.random() > 0.5 ? 1 : 0) : (Math.floor(Math.random() * 6) + 1);
                
                let myKey = isCreator ? 'player1' : 'player2';
                let oppKey = isCreator ? 'player2' : 'player1';
                
                let updates = {};
                updates[myKey + '/score'] = myScore;
                updates[myKey + '/ready'] = true;
                
                if (data[oppKey].ready) {
                    updates['status'] = 'finished';
                }
                
                update(gameRef, updates).then(() => {
                    playBtn.innerText = 'Ожидание соперника...';
                });
            });
        }

        function resetGameUI(type) {
            let playBtn = document.getElementById(type + 'PlayBtn');
            playBtn.innerText = 'Создать лот';
            playBtn.onclick = () => createBet(type);
            playBtn.classList.remove('disabled');
            playBtn.disabled = false;
            document.getElementById(type + 'PlayerRes').innerText = '?';
            document.getElementById(type + 'OpponentRes').innerText = '?';
            document.getElementById(type + 'OpponentName').innerText = 'Ожидание...';
        }

        // --- КРАШ (ФОН) ---
        let backgroundCrashInterval = null;
        let isBackgroundFlying = false;
        function startBackgroundCrash() {
            if (backgroundCrashInterval) return;
            backgroundCrashInterval = setInterval(() => {
                if (!isBackgroundFlying && !document.getElementById('pane-crash').classList.contains('active')) return;
                if (!isBackgroundFlying) runBackgroundRocket();
            }, 5000);
        }
        function stopBackgroundCrash() { clearInterval(backgroundCrashInterval); backgroundCrashInterval = null; }
        
        function runBackgroundRocket() {
            if (isBackgroundFlying) return;
            isBackgroundFlying = true;
            const multText = document.getElementById('rocketMultiplier');
            const graphPath = document.getElementById('graphPath');
            const graphFill = document.getElementById('graphFill');
            rocketMult = 1.0; rocketTime = 0;
            multText.classList.remove('crashed');
            graphPath.setAttribute('d', 'M0,100 L0,100'); graphFill.setAttribute('d', 'M0,100 L0,100 L0,100 Z');

            const random = Math.random();
            let localCrashPoint = Math.max(1.0, (0.99 / (1.0 - random))); 
            localCrashPoint = Math.floor(localCrashPoint * 100) / 100;
            if (localCrashPoint < 1.01) localCrashPoint = 1.01;

            let time = 0;
            let interval = setInterval(() => {
                time += 0.1;
                rocketMult = Math.pow(1.06, time); 
                if (rocketMult > 100) rocketMult = 100;
                multText.innerText = `x${rocketMult.toFixed(2).replace('.', ',')}`;
                
                let xPercent = Math.min((time / 40) * 100, 100);
                let yPercent = 100 - Math.min((rocketMult / 41) * 100, 95); 
                graphPath.setAttribute('d', `M0,100 Q${xPercent/2},${100} ${xPercent},${yPercent}`);
                graphFill.setAttribute('d', `M0,100 Q${xPercent/2},${100} ${xPercent},${yPercent} L${xPercent},100 Z`);

                if (rocketMult >= localCrashPoint) {
                    clearInterval(interval); isBackgroundFlying = false;
                    multText.classList.add('crashed');
                    multText.innerText = `x${localCrashPoint.toFixed(2).replace('.', ',')}`;
                    setTimeout(() => {
                        multText.innerText = 'x1,00';
                        graphPath.setAttribute('d', 'M0,100 L0,100');
                        graphFill.setAttribute('d', 'M0,100 L0,100 L0,100 Z');
                    }, 3000);
                }
            }, 100);
        }

        window.setAutoCashout = function() {
            let val = parseFloat(document.getElementById('autoCashoutInput').value);
            if (val && val > 1.0) { autoCashout = val; showToast(`Автозабор на x${val.toFixed(2)}`, '🤖'); } 
            else { autoCashout = 0; showToast('Автозабор отключен', '❌'); }
        }

        function updateRocketHistoryUI() {
            const container = document.getElementById('rocketHistory');
            container.innerHTML = rocketHistory.slice(0, 10).map(mult => {
                let colorClass = mult > 2 ? 'high' : (mult < 1.5 ? 'low' : '');
                return `<div class="h-strip-badge ${colorClass}">x${mult.toFixed(2).replace('.', ',')}</div>`;
            }).join('');
        }

        window.updateManualBet = function(val) {
            rocketBet = parseInt(val) || 0;
            if (rocketBet > 10000000) {
                rocketBet = 10000000;
                document.getElementById('manualBetInput').value = rocketBet;
                showToast('Максимальная ставка 10 000 000!', '⚠️');
            }
            checkBetButton();
        }

        window.setBet = function(amount, btn) {
            rocketBet = amount;
            document.getElementById('manualBetInput').value = rocketBet;
            document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            checkBetButton();
        }

        window.handleRocket = function() {
            const btn = document.getElementById('rocketBtn');
            const multText = document.getElementById('rocketMultiplier');
            const graphPath = document.getElementById('graphPath');
            const graphFill = document.getElementById('graphFill');
            const liveBets = document.getElementById('liveBetsContainer');

            if (rocketState === 'idle' && !hasCashedOut) {
                if (rocketBet < 100) return showToast('Минимальная ставка 100', '⚠️');
                if (balance < rocketBet) return showToast('Недостаточно монет!', '❌');
                
                balance -= rocketBet; updateUI();
                
                rocketState = 'flying'; rocketMult = 1.0; rocketTime = 0; hasCashedOut = false;
                multText.classList.remove('crashed'); multText.innerText = 'x1,00';
                btn.innerText = 'Забрать'; btn.classList.remove('disabled'); btn.classList.add('cashout');
                
                graphPath.setAttribute('d', 'M0,100 L0,100'); graphFill.setAttribute('d', 'M0,100 L0,100 L0,100 Z');

                liveBets.innerHTML = `
                    <div class="crash-bet-row" id="myBetRow">
                        <div class="crash-user"><div class="crash-user-avatar">${currentUserAvatar}</div>${currentUserName}</div>
                        <div class="crash-user-amounts"><span>${rocketBet.toLocaleString('ru-RU')}</span><span style="color:var(--text-muted);" id="myWinDisplay">...</span></div>
                    </div>
                `;

                const random = Math.random();
                currentCrashPoint = Math.max(1.0, (0.99 / (1.0 - random))); 
                currentCrashPoint = Math.floor(currentCrashPoint * 100) / 100;
                if (currentCrashPoint < 1.01) currentCrashPoint = 1.01;

                rocketInterval = setInterval(() => {
                    rocketTime += 0.1;
                    rocketMult = Math.pow(1.06, rocketTime); 
                    if (rocketMult > 100) rocketMult = 100;
                    multText.innerText = `x${rocketMult.toFixed(2).replace('.', ',')}`;
                    
                    let xPercent = Math.min((rocketTime / 40) * 100, 100);
                    let yPercent = 100 - Math.min((rocketMult / 41) * 100, 95); 
                    graphPath.setAttribute('d', `M0,100 Q${xPercent/2},${100} ${xPercent},${yPercent}`);
                    graphFill.setAttribute('d', `M0,100 Q${xPercent/2},${100} ${xPercent},${yPercent} L${xPercent},100 Z`);

                    if (autoCashout > 0 && !hasCashedOut && rocketMult >= autoCashout) {
                        hasCashedOut = true;
                        let winAmount = Math.floor(rocketBet * autoCashout);
                        balance += winAmount; updateUI();
                        showToast(`АВТОЗАБОР: +${winAmount.toLocaleString('ru-RU')} 🪙 (x${autoCashout.toFixed(2)})`, '🤖');
                        btn.innerText = 'Ожидание...'; btn.classList.remove('cashout'); btn.classList.add('disabled');
                        if (document.getElementById('myWinDisplay')) {
                            document.getElementById('myWinDisplay').innerText = `x${autoCashout.toFixed(2)} · ${winAmount.toLocaleString('ru-RU')}`;
                            document.getElementById('myWinDisplay').style.color = 'var(--success)';
                        }
                    }

                    if (rocketMult >= currentCrashPoint) {
                        clearInterval(rocketInterval); rocketState = 'idle';
                        multText.classList.add('crashed'); multText.innerText = `УПАЛА НА x${currentCrashPoint.toFixed(2).replace('.', ',')}`;
                        btn.innerText = 'Запустить'; btn.classList.remove('cashout'); btn.classList.remove('disabled');
                        
                        rocketHistory.unshift(currentCrashPoint);
                        if(rocketHistory.length > 10) rocketHistory.pop();
                        updateUI();
                        
                        if (hasCashedOut) showToast(`Ракета улетела на x${currentCrashPoint.toFixed(2)}`, '💥');
                        else {
                            showToast(`Вы не успели! Упала на x${currentCrashPoint.toFixed(2)}`, '💥');
                            if(document.getElementById('myWinDisplay')) {
                                document.getElementById('myWinDisplay').innerText = `x0,00 · 0`;
                                document.getElementById('myWinDisplay').style.color = 'var(--danger)';
                            }
                        }

                        setTimeout(() => {
                            multText.innerText = 'x1,00';
                            graphPath.setAttribute('d', 'M0,100 L0,100');
                            graphFill.setAttribute('d', 'M0,100 L0,100 L0,100 Z');
                            checkBetButton();
                        }, 3000);
                    }
                }, 100);

            } else if (rocketState === 'flying' && !hasCashedOut) {
                hasCashedOut = true;
                let winAmount = Math.floor(rocketBet * rocketMult);
                balance += winAmount; updateUI();
                showToast(`Вы забрали ${winAmount.toLocaleString('ru-RU')} 🪙 (x${rocketMult.toFixed(2)})`, '🚀');
                
                btn.innerText = 'Ожидание...'; btn.classList.remove('cashout'); btn.classList.add('disabled');

                if (document.getElementById('myWinDisplay')) {
                    document.getElementById('myWinDisplay').innerText = `x${rocketMult.toFixed(2).replace('.', ',')} · ${winAmount.toLocaleString('ru-RU')}`;
                    document.getElementById('myWinDisplay').style.color = 'var(--success)';
                }
            }
        }

        window.showToast = function(text, icon = "🎉") {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').innerText = text;
            toast.querySelector('.toast-icon').innerText = icon;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('userName').innerText = currentUserName;
            if(tg.initDataUnsafe.user.photo_url) {
                document.getElementById('userAvatar').innerHTML = currentUserAvatar;
                document.getElementById('headerAvatar').innerHTML = currentUserAvatar;
            }
        }
        updateUI();
        renderRoaming();
    </script>
